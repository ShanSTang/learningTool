<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Subtraction | Go Low!</title>
    <link rel="stylesheet" href="style.css">

    <style>
        body {
            background: #f5f2ff;
        }

        .subtraction-game {
            max-width: 950px;
            margin: 20px auto;
            padding: 15px;
            text-align: center;
        }

        .game-instructions {
            font-size: 1.2rem;
            margin: 15px 0 25px;
        }

        .game-scene {
            height: 500px;
            background: #dff3ff;
            border-radius: 20px;
            position: relative;
            overflow: hidden;
            border-bottom: 12px solid #8bba78;
            touch-action: none;
            user-select: none;
        }

        .overpass {
            position: absolute;
            left: 65%;
            bottom: 0;
            width: 220px;
            height: 100%;
            transform: translateX(-50%);
            z-index: 2;
            pointer-events: none;
        }

        .bridge-beam {
            position: absolute;
            left: 0;
            right: 0;
            height: 20px;
            background: #8b6545;
            border: 3px solid #62452e;
            border-radius: 4px;
        }

        .bridge-support {
            background: #c9a77d;
        }

        .bridge-background {
            position: absolute;
            top: 0;
            bottom: 0;
            left: 0;
            right: 0;
            background: #d2b48c;
        }

        .car {
            position: absolute;
            left: 8%;
            bottom: 0;
            width: 190px;
            height: 100%;
            z-index: 3;
            transition: left 1.4s ease-in-out;
            pointer-events: none;
        }

        .car.moving {
            left: 75%;
        }

        .car-body {
            position: absolute;
            bottom: 0;
            width: 190px;
            height: 38px;
            background: #e85d5d;
            border: 3px solid #a83232;
            border-radius: 12px 25px 8px 8px;
        }

        .car-wheel {
            position: absolute;
            bottom: -8px;
            width: 28px;
            height: 28px;
            background: #333;
            border: 4px solid #777;
            border-radius: 50%;
            z-index: 2;
        }

        .car-wheel.left {
            left: 25px;
        }

        .car-wheel.right {
            right: 25px;
        }

        .car-blocks {
            position: absolute;
            bottom: 38px;
            left: 50%;
            transform: translateX(-50%);
            display: flex;
            flex-direction: column-reverse;
            align-items: center;
        }

        .block {
            width: 35px;
            height: 35px;
            background: #f4b942;
            border: 2px solid #bd8521;
            border-radius: 5px;
            margin-top: -1px;
        }

        .game-counter {
            font-size: 1.1rem;
            font-weight: bold;
            margin: 15px;
        }

        .finger-instructions {
            font-size: 1.15rem;
            font-weight: bold;
            margin: 18px 0 8px;
        }

        .hold-progress {
            width: 90%;
            max-width: 350px;
            height: 16px;
            background: #e2dcf1;
            border-radius: 20px;
            margin: 12px auto 20px;
            overflow: hidden;
        }

        .hold-progress-fill {
            width: 0%;
            height: 100%;
            background: #7655c9;
            border-radius: 20px;
            transition: width 0.02s linear;
        }

        .game-button {
            background: #7655c9;
            color: white;
            border: none;
            border-radius: 12px;
            padding: 14px 25px;
            font-size: 1.1rem;
            font-weight: bold;
            cursor: pointer;
            margin: 10px;
        }

        .game-button:disabled {
            background: #aaa;
            cursor: not-allowed;
        }

        .game-message {
            font-size: 1.7rem;
            font-weight: bold;
            min-height: 40px;
            margin: 15px;
            color: #513b91;
        }

        .game-message.error {
            color: #d44747;
        }

        .game-message.success {
            color: #27945c;
        }

        .page-nav {
            display: flex;
            justify-content: center;
            flex-wrap: wrap;
            gap: 12px;
            padding: 12px;
        }

        .nav-link {
            text-decoration: none;
            background: #eee9ff;
            color: #513b91;
            padding: 12px 20px;
            border-radius: 12px;
            font-weight: bold;
        }

        .nav-link.active {
            background: #7655c9;
            color: white;
        }

        .hidden {
            display: none !important;
        }

        @media (max-width: 600px) {
            .subtraction-game {
                padding: 8px;
            }

            .game-scene {
                height: 500px;
            }

            .overpass {
                left: 72%;
                width: 170px;
            }

            .car {
                left: 2%;
                transform: scale(0.85);
                transform-origin: bottom left;
            }

            .car.moving {
                left: 65%;
            }
        }
    </style>
</head>

<body>

<header>
    <h1>How Low Can You Go?</h1>
    <button class="game-button" id="new-game-button"> New Round ↻ </button>
</header>

<nav class="page-nav">
    <a href="index.html" class="nav-link">Finger Match</a>
    <a href="subtraction.html" class="nav-link active">Subtraction</a>
    <a href="multiplication.html" class="nav-link">Multiplication</a>
    <a href="division.html" class="nav-link">Division</a>
</nav>

<main class="subtraction-game">

    <p class="game-instructions" id="instructions">
        Hold your fingers on the scene to take blocks off the car!
    </p>

    <div class="game-scene" id="game-scene">

        <div class="overpass">
            <div class="bridge-background"></div>
            <div class="bridge-beam" id="bridge-beam"></div>
            <div class="bridge-support left"></div>
            <div class="bridge-support right"></div>
        </div>

        <div class="car" id="car">
            <div class="car-blocks" id="car-blocks"></div>
            <div class="car-body"></div>
            <div class="car-wheel left"></div>
            <div class="car-wheel right"></div>
        </div>

    </div>

    <div class="hold-progress">
        <div class="hold-progress-fill" id="hold-progress-fill"></div>
    </div>

    <div class="game-counter" id="car-count"></div>

    <div class="game-message" id="message"></div>
</main>

<script>
    const HOLD_DURATION = 1000;

    let startingBlocks = 0;
    let bridgeHeight = 0;
    let removedBlocks = 0;
    let stage = "removing";

    let activePointers = new Set();
    let holdTimer = null;
    let progressTimer = null;
    let holdStartTime = 0;
    let holdComplete = false;
    let retryTimer = null;

    const gameScene = document.getElementById("game-scene");
    const car = document.getElementById("car");
    const carBlocks = document.getElementById("car-blocks");
    const carCount = document.getElementById("car-count");
    const message = document.getElementById("message");
    const progressFill = document.getElementById("hold-progress-fill");

    function newProblem() {
        clearTimeout(retryTimer);

        bridgeHeight = Math.floor(Math.random() * 3) + 1;

        // Starting stack is always taller than the bridge.
        startingBlocks =
            Math.floor(Math.random() * (8 - bridgeHeight)) +
            bridgeHeight + 1;

        resetRound();
    }

    function resetRound() {
        cancelHold();

        removedBlocks = 0;
        stage = "removing";

        car.classList.remove("moving");

        message.textContent = "";
        message.className = "game-message";

        document.getElementById("instructions").textContent =
            "Hold your fingers on the scene to take blocks off the car!";

        const beamPosition = 38 + bridgeHeight * 35;

        document.getElementById("bridge-beam").style.bottom =
            beamPosition + "px";

        drawCarBlocks();
        updateCounts();
    }

    function drawCarBlocks() {
        carBlocks.innerHTML = "";

        const remaining = startingBlocks - removedBlocks;

        for (let i = 0; i < remaining; i++) {
            const block = document.createElement("div");
            block.className = "block";
            carBlocks.appendChild(block);
        }
    }

    function updateCounts() {
        const remaining = startingBlocks - removedBlocks;

        carCount.textContent =
            "Blocks on car: " + remaining +
            " | Blocks removed: " + removedBlocks;
    }

    function cancelHold() {
        clearTimeout(holdTimer);
        clearInterval(progressTimer);

        holdTimer = null;
        progressTimer = null;
        holdStartTime = 0;
        holdComplete = false;

        progressFill.style.width = "0%";
    }

    function startHold() {
        if (stage !== "removing") return;
        if (activePointers.size === 0) return;

        const fingerNumber = activePointers.size;
        const remaining = startingBlocks - removedBlocks;

        if (fingerNumber > remaining) {
            cancelHold();
            message.textContent = "Not enough blocks for that many fingers!";
            message.className = "game-message error";
            return;
        }

        message.textContent = "";
        message.className = "game-message";

        holdStartTime = Date.now();

        holdTimer = setTimeout(() => {
            if (activePointers.size !== fingerNumber) return;

            // Remove one block for each finger held.
            removedBlocks += fingerNumber;

            holdComplete = true;
            activePointers.clear();

            clearInterval(progressTimer);
            progressTimer = null;
            holdTimer = null;

            progressFill.style.width = "100%";

            drawCarBlocks();
            updateCounts();

            message.textContent =
                "You took away " + fingerNumber +
                (fingerNumber === 1 ? " block!" : " blocks!");

            message.className = "game-message success";

            // Automatically test the car after a brief pause.
            setTimeout(() => {
                if (stage === "removing") {
                    driveCar();
                }
            }, 700);

        }, HOLD_DURATION);

        progressTimer = setInterval(() => {
            const elapsed = Date.now() - holdStartTime;
            const progress = Math.min(
                elapsed / HOLD_DURATION * 100,
                100
            );

            progressFill.style.width = progress + "%";
        }, 20);
    }

    // Track fingers anywhere on the screen.
document.addEventListener("pointerdown", (event) => {
    if (stage !== "removing") return;
    if (holdComplete) return;

    event.preventDefault();

    cancelHold();

    activePointers.add(event.pointerId);

    startHold();
}, { passive: false });

document.addEventListener("pointerup", releasePointer);
document.addEventListener("pointercancel", releasePointer);

window.addEventListener("blur", () => {
    if (!holdComplete) {
        activePointers.clear();
        cancelHold();
    }
});

    function releasePointer(event) {
        if (!activePointers.has(event.pointerId)) return;

        activePointers.delete(event.pointerId);

        if (!holdComplete) {
            cancelHold();

            if (activePointers.size > 0 && stage === "removing") {
                startHold();
            }
        } else {
            if (activePointers.size === 0) {
                holdComplete = false;
            }
        }
    }

    gameScene.addEventListener("pointerup", releasePointer);
    gameScene.addEventListener("pointercancel", releasePointer);

    window.addEventListener("blur", () => {
        if (!holdComplete) {
            activePointers.clear();
            cancelHold();
        }
    });

    function driveCar() {
    if (stage !== "removing") return;

    cancelHold();
    activePointers.clear();

    stage = "driving";

    const remaining = startingBlocks - removedBlocks;

    car.classList.add("moving");

    if (remaining > bridgeHeight) {
        // Car is too tall.
        setTimeout(() => {
            message.textContent = "TOO TALL!";
            message.className = "game-message error";

            retryTimer = setTimeout(resetRound, 1800);
        }, 1000);

    } else {
        // Car fits under the bridge.
        setTimeout(() => {
            message.textContent = "You made it through! Great job!";
            message.className = "game-message success";

            stage = "complete";

            retryTimer = setTimeout(newProblem, 2500);
        }, 1500);
    }
}
    document.getElementById("new-game-button")
        .addEventListener("click", newProblem);

    newProblem();
</script>

</body>
</html>
