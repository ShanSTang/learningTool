
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport"
      content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">

<title>Subtraction</title>

<link href="style.css" rel="stylesheet"/>

<style>
/* Two sides of the subtraction game */
#game {
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 24px;
    position: relative;
    touch-action: none;
}

#match-board {
    display: grid;
    grid-template-columns: 1fr 1fr;
    width: 100%;
    max-width: 1100px;
    min-height: 180px;
}

.side {
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    padding: 12px;
    min-width: 0;
}

.side + .side {
    border-left: 4px solid #7655c9;
}

.side-label {
    font-size: 20px;
    font-weight: bold;
    color: #7655c9;
    margin-bottom: 18px;
}

.circle-row {
    display: flex;
    justify-content: center;
    align-items: center;
    flex-wrap: wrap;
    gap: 10px;
    min-height: 65px;
    width: 100%;
}

.circle {
    border-radius: 50%;
    flex-shrink: 0;
    transition: transform 0.3s, opacity 0.3s;
}

.circle.removing {
    transform: scale(0);
    opacity: 0;
}

#counter {
    text-align: center;
    min-height: 30px;
    font-size: 22px;
}

#hold-wheel {
    position: relative;
}

#wheel-inner {
    transform-origin: center;
}

@media (max-width: 600px) {
    #game {
        gap: 16px;
        padding: 12px;
    }

    #match-board {
        min-height: 150px;
    }

    .side {
        padding: 8px 5px;
    }

    .side-label {
        font-size: 17px;
        margin-bottom: 12px;
    }

    .circle-row {
        gap: 6px;
    }
}
</style>
</head>

<body>

<header>
    <div>
        <h1>Subtraction</h1>
        <div id="instructions">
            Hold down the number of fingers needed to make both sides equal!
        </div>
    </div>

    <div class="level-selector">
        <button class="level-btn active" onclick="setLevel(2, this)">
            LvL 1
        </button>
        <button class="level-btn" onclick="setLevel(4, this)">
            LvL 2
        </button>
        <button class="level-btn" onclick="setLevel(8, this)">
            LvL 3
        </button>
    </div>

    <button onclick="newRound()">New Round ↻</button>
</header>

<nav class="page-nav">
    <a href="index.html" class="nav-link">Pop!</a>
    <a href="subtraction.html" class="nav-link active">Subtraction</a>
    <a href="multiplication.html" class="nav-link">Multiplication</a>
    <a href="division.html" class="nav-link">Division</a>
</nav>

<main id="game">

    <div id="match-board">
        <div class="side">
            <div class="side-label">Left</div>
            <div class="circle-row" id="left-circles"></div>
        </div>

        <div class="side">
            <div class="side-label">Right</div>
            <div class="circle-row" id="right-circles"></div>
        </div>
    </div>

    <div id="counter">Get ready!</div>

    <div id="hold-wheel">
        <div id="wheel-inner"></div>
    </div>

</main>

<div id="success">
    <h2>AMAZING! 🎉</h2>
    <p>You made both sides equal!</p>
</div>

<script>
const HOLD_DURATION = 3000;

const colors = [
    "#ff6b6b",
    "#ffb347",
    "#ffd93d",
    "#6bcB77",
    "#4d96ff",
    "#b983ff",
    "#ff85a1",
    "#45c4b0"
];

const leftCircles = document.getElementById("left-circles");
const rightCircles = document.getElementById("right-circles");
const counter = document.getElementById("counter");
const success = document.getElementById("success");
const wheel = document.getElementById("wheel-inner");

let leftCount = 0;
let rightCount = 0;
let maxDifference = 2;

let activePointers = new Set();
let holdTimer = null;
let progressTimer = null;
let roundLocked = false;

function randomInt(min, max) {
    return Math.floor(Math.random() * (max - min + 1)) + min;
}

function setLevel(difference, button) {
    maxDifference = difference;

    document.querySelectorAll(".level-btn").forEach(btn => {
        btn.classList.remove("active");
    });

    button.classList.add("active");
    newRound();
}

function newRound() {
    clearHold();
    activePointers.clear();
    roundLocked = false;

    success.classList.remove("show");

    leftCircles.innerHTML = "";
    rightCircles.innerHTML = "";

    // Create two different amounts of circles.
    const larger = randomInt(4, 10);
    const difference = randomInt(1, maxDifference);
    const smaller = larger - difference;

    if (Math.random() < 0.5) {
        leftCount = larger;
        rightCount = smaller;
    } else {
        leftCount = smaller;
        rightCount = larger;
    }

    drawCircles(leftCircles, leftCount);
    drawCircles(rightCircles, rightCount);

    counter.textContent = "How many fingers do you need?";
    updateWheel(0);
}

function drawCircles(container, count) {
    container.innerHTML = "";

    const color = container === leftCircles ? "#4d96ff" : "#b983ff";

    for (let i = 0; i < count; i++) {
        const circle = document.createElement("div");

        circle.className = "circle";
        circle.style.width = "45px";
        circle.style.height = "45px";
        circle.style.backgroundColor = color;

        container.appendChild(circle);
    }
}

function updateWheel(progress) {
    // Circular progress animation using the existing hold-wheel.
    const degrees = progress * 360;

    wheel.style.background =
        `conic-gradient(#7655c9 ${degrees}deg, #e8e2f5 ${degrees}deg)`;

    wheel.style.borderRadius = "50%";
}

function clearHold() {
    clearTimeout(holdTimer);
    clearInterval(progressTimer);

    holdTimer = null;
    progressTimer = null;

    updateWheel(0);
}

function startHold() {
    clearHold();

    const fingerNumber = activePointers.size;
    if (fingerNumber === 0) return;

    const startTime = Date.now();

    counter.textContent =
        "Holding " + fingerNumber +
        (fingerNumber === 1 ? " finger..." : " fingers...");

    progressTimer = setInterval(() => {
        const progress = Math.min(
            (Date.now() - startTime) / HOLD_DURATION,
            1
        );

        updateWheel(progress);
    }, 30);

    holdTimer = setTimeout(() => {
        clearInterval(progressTimer);
        progressTimer = null;
        holdTimer = null;

        if (activePointers.size !== fingerNumber) {
            clearHold();
            return;
        }

        updateWheel(1);
        checkAnswer(fingerNumber);

    }, HOLD_DURATION);
}

function checkAnswer(fingers) {
    const difference = Math.abs(leftCount - rightCount);

    if (fingers !== difference) {
        counter.textContent = "Try again!";
        activePointers.clear();
        clearHold();
        return;
    }

    roundLocked = true;

    const largerSide =
        leftCount > rightCount ? leftCircles : rightCircles;

    const circles = Array.from(largerSide.children);

    circles.slice(-fingers).forEach((circle, index) => {
        setTimeout(() => {
            circle.classList.add("removing");

            setTimeout(() => circle.remove(), 300);
        }, index * 120);
    });

    counter.textContent = "Perfect! Both sides are equal!";

    activePointers.clear();

    setTimeout(() => {
        success.classList.add("show");
        createConfetti();

        setTimeout(newRound, 3000);
    }, 500);
}

function createConfetti() {
    const confettiColors = [
        "#ff6b6b",
        "#ffd93d",
        "#6bcB77",
        "#4d96ff",
        "#b983ff",
        "#ff85a1"
    ];

    for (let i = 0; i < 90; i++) {
        const piece = document.createElement("div");

        piece.className = "confetti";
        piece.style.position = "fixed";
        piece.style.top = "-15px";
        piece.style.left = Math.random() * 100 + "vw";
        piece.style.width = "12px";
        piece.style.height = "18px";
        piece.style.backgroundColor =
            confettiColors[randomInt(0, confettiColors.length - 1)];
        piece.style.zIndex = "20";
        piece.style.pointerEvents = "none";
        piece.style.animation = "confetti-fall 2.8s linear forwards";
        piece.style.animationDelay = Math.random() * 0.8 + "s";

        document.body.appendChild(piece);

        setTimeout(() => piece.remove(), 4000);
    }
}

// Track fingers anywhere inside the game area.
// Track fingers anywhere on the screen.
document.addEventListener("pointerdown", event => {
    if (roundLocked) return;

    // Don't count clicks on navigation or buttons.
    if (event.target.closest("button, a")) return;

    event.preventDefault();

    activePointers.add(event.pointerId);

    // Restart the timer using the new finger count.
    startHold();

}, { passive: false });

function releasePointer(event) {
    if (!activePointers.has(event.pointerId)) return;

    activePointers.clear();

    if (!roundLocked) {
        clearHold();
        counter.textContent = "Try holding your fingers again!";
    }
}

document.addEventListener("pointerup", releasePointer);
document.addEventListener("pointercancel", releasePointer);

window.addEventListener("blur", () => {
    activePointers.clear();
    clearHold();
});

function releasePointer(event) {
    if (!activePointers.has(event.pointerId)) return;

    activePointers.delete(event.pointerId);

    if (!roundLocked) {
        clearHold();
        activePointers.clear();
        counter.textContent = "Try holding your fingers again!";
    }
}

document.addEventListener("pointerup", releasePointer);
document.addEventListener("pointercancel", releasePointer);

window.addEventListener("blur", () => {
    activePointers.clear();
    clearHold();
});

newRound();
</script>

<style>
@keyframes confetti-fall {
    to {
        transform: translateY(110vh) rotate(720deg);
        opacity: 0;
    }
}

body {
    touch-action: none;
}

#game {
    touch-action: none;
    user-select: none;
    -webkit-user-select: none;
}

#match-board {
    display: grid !important;
    grid-template-columns: 1fr 1fr;
    width: 100%;
}

.circle-row {
    display: flex !important;
    flex-direction: row !important;
    flex-wrap: wrap !important;
    justify-content: center;
    align-items: center;
    gap: 10px;
    width: 100%;
}

.circle {
    width: 45px;
    height: 45px;
    border-radius: 50%;
    flex: 0 0 45px;
    position: relative;
    transition: transform 0.3s, opacity 0.3s;
}

</style>

</body>
</html>
