<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport"
      content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>Pop 2!</title>
<link href="style.css" rel="stylesheet"/>

<style>
/* Keep the original Finger Match page layout; only arrange the two groups. */
#game {
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 36px;
    min-height: calc(100vh - 150px);
    touch-action: none;
    user-select: none;
    -webkit-user-select: none;
}

#match-board {
    display: grid;
    grid-template-columns: minmax(0, 1fr) minmax(0, 1fr);
    width: min(100%, 1200px);
    flex: 1;
    min-height: 350px;
}

.side {
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    min-width: 0;
    padding: 24px;
}

.side + .side {
    border-left: 4px solid #7655c9;
}

.side-label {
    margin-bottom: 18px;
    color: #7655c9;
    font-size: 20px;
    font-weight: bold;
}

.circle-rows {
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 10px;
    width: 100%;
}

/* Each explicit row contains no more than five circles. */
.circle-row {
    display: flex;
    flex-wrap: nowrap;
    justify-content: center;
    align-items: center;
    gap: 10px;
    width: 100%;
    min-height: 45px;
}

/* Match the 45px circle size used in the original game. */
.circle {
    display: block;
    position: relative;
    flex: 0 0 80px;
    width: 80px;
    height: 80px;
    border-radius: 50%;
    transition: transform 0.3s ease, opacity 0.3s ease;
}

.circle.removing {
    transform: scale(0);
    opacity: 0;
}

/* A circular progress ring, using the same purple as the original game. */
#hold-wheel {
    display: grid;
    place-items: center;
    width: 76px;
    height: 76px;
    border-radius: 50%;
}

#wheel-inner {
    width: 76px;
    height: 76px;
    border-radius: 50%;
    background: conic-gradient(#7655c9 0deg, #e8e2f5 0deg);
    -webkit-mask: radial-gradient(farthest-side, transparent calc(100% - 8px), #000 calc(100% - 7px));
    mask: radial-gradient(farthest-side, transparent calc(100% - 8px), #000 calc(100% - 7px));
}

#counter {
    min-height: 30px;
    text-align: center;
}

#success {
    z-index: 10;
}

.confetti {
    position: fixed;
    top: -16px;
    width: 12px;
    height: 18px;
    z-index: 20;
    pointer-events: none;
    animation: confetti-fall 2.8s linear forwards;
}

@keyframes confetti-fall {
    to {
        transform: translateY(110vh) rotate(720deg);
        opacity: 0;
    }
}

html, body {
    touch-action: none;
}

@media (max-width: 600px) {
    #game {
        gap: 16px;
        padding: 12px;
    }

    #match-board {
        min-height: 150px;
    }

    .side {
        padding: 8px 5px;
    }

    .side-label {
        margin-bottom: 12px;
        font-size: 17px;
    }

    .circle-row {
        gap: 6px;
    }

    .circle-rows {
        gap: 8px;
    }
}
</style>
</head>

<body>

<header>
    <div>
        <h1>Pop 2!</h1>
        <div id="instructions">
            Hold down the number of fingers needed to make both sides equal!
        </div>
    </div>

    <div class="level-selector">
        <button class="level-btn active" onclick="setLevel(1, this)">LvL 1</button>
        <button class="level-btn" onclick="setLevel(2, this)">LvL 2</button>
        <button class="level-btn" onclick="setLevel(3, this)">LvL 3</button>
    </div>

    <button onclick="newRound()">New Round ↻</button>
</header>

<nav class="page-nav">
    <a href="index.html" class="nav-link">Pop!</a>
    <a href="subtraction.html" class="nav-link active">Pop 2!</a>
    <a href="multiplication.html" class="nav-link">Multiplication</a>
    <a href="division.html" class="nav-link">Division</a>
</nav>

<main id="game">
    <div id="match-board">
        <div class="side">
            <div class="side-label">Left</div>
            <div class="circle-rows" id="left-circles"></div>
        </div>

        <div class="side">
            <div class="side-label">Right</div>
            <div class="circle-rows" id="right-circles"></div>
        </div>
    </div>

    <div id="counter">Get ready!</div>
    <div id="hold-wheel"><div id="wheel-inner"></div></div>
</main>

<div id="success">
    <h2>AMAZING! 🎉</h2>
    <p>You made both sides equal!</p>
</div>

<script>
const HOLD_DURATION = 1000;
const MAX_DOTS_PER_ROW = 5;

const leftCircles = document.getElementById("left-circles");
const rightCircles = document.getElementById("right-circles");
const counter = document.getElementById("counter");
const success = document.getElementById("success");
const wheel = document.getElementById("wheel-inner");

let leftCount = 0;
let rightCount = 0;
let maxDots = 5;
let maxDifference = 2;

let activePointers = new Set();
let holdTimer = null;
let progressTimer = null;
let roundLocked = false;
let roundNumber = 0;

function randomInt(min, max) {
    return Math.floor(Math.random() * (max - min + 1)) + min;
}

function setLevel(level, button) {
    const settings = {
        1: { maxDots: 5, maxDifference: 2 },
        2: { maxDots: 8, maxDifference: 4 },
        3: { maxDots: 10, maxDifference: 8 }
    };

    const selected = settings[level] || settings[1];
    maxDots = selected.maxDots;
    maxDifference = selected.maxDifference;

    document.querySelectorAll(".level-btn").forEach(btn => {
        btn.classList.remove("active");
    });

    button.classList.add("active");
    newRound();
}

function newRound() {
    roundNumber++;
    clearHold();
    activePointers.clear();
    roundLocked = false;
    success.classList.remove("show");

    leftCircles.innerHTML = "";
    rightCircles.innerHTML = "";

    // Build every valid pair so both sides stay within this level's range.
    const validPairs = [];

    for (let smaller = 1; smaller <= maxDots; smaller++) {
        for (let larger = smaller + 1; larger <= maxDots; larger++) {
            const difference = larger - smaller;
            if (difference <= maxDifference) {
                validPairs.push({ smaller, larger });
            }
        }
    }

    const pair = validPairs[randomInt(0, validPairs.length - 1)];

    if (Math.random() < 0.5) {
        leftCount = pair.larger;
        rightCount = pair.smaller;
    } else {
        leftCount = pair.smaller;
        rightCount = pair.larger;
    }

    drawCircles(leftCircles, leftCount, "#4d96ff");
    drawCircles(rightCircles, rightCount, "#b983ff");

    counter.textContent = "How many fingers do you need?";
    updateWheel(0);
}

function drawCircles(container, count, color) {
    container.replaceChildren();

    for (let start = 0; start < count; start += MAX_DOTS_PER_ROW) {
        const row = document.createElement("div");
        row.className = "circle-row";

        const dotsInThisRow = Math.min(
            MAX_DOTS_PER_ROW,
            count - start
        );

        for (let i = 0; i < dotsInThisRow; i++) {
            const circle = document.createElement("div");
            circle.className = "circle";
            circle.style.backgroundColor = color;
            row.appendChild(circle);
        }

        container.appendChild(row);
    }
}

function updateWheel(progress) {
    const degrees = Math.max(0, Math.min(1, progress)) * 360;
    wheel.style.background =
        `conic-gradient(#7655c9 ${degrees}deg, #e8e2f5 ${degrees}deg)`;
}

function clearHold() {
    if (holdTimer !== null) clearTimeout(holdTimer);
    if (progressTimer !== null) clearInterval(progressTimer);

    holdTimer = null;
    progressTimer = null;
    updateWheel(0);
}

function startHold() {
    clearHold();

    const fingersAtStart = activePointers.size;
    if (fingersAtStart === 0 || roundLocked) return;

    const startedAt = performance.now();

    counter.textContent = `Holding ${fingersAtStart} ${
        fingersAtStart === 1 ? "finger" : "fingers"
    }...`;

    progressTimer = setInterval(() => {
        // If the number of held fingers changed, don't keep progressing.
        if (activePointers.size !== fingersAtStart) {
            clearHold();
            return;
        }

        const progress = Math.min(
            (performance.now() - startedAt) / HOLD_DURATION,
            1
        );
        updateWheel(progress);
    }, 30);

    holdTimer = setTimeout(() => {
        if (activePointers.size !== fingersAtStart || roundLocked) {
            clearHold();
            return;
        }

        clearInterval(progressTimer);
        progressTimer = null;
        holdTimer = null;
        updateWheel(1);
        checkAnswer(fingersAtStart);
    }, HOLD_DURATION);
}

function checkAnswer(fingers) {
    const needed = Math.abs(leftCount - rightCount);

    if (fingers !== needed) {
        // Keep the round available for another attempt.
        roundLocked = true;
        counter.textContent = "Not quite! Try again.";
        activePointers.clear();

        setTimeout(() => {
            if (roundLocked) {
                roundLocked = false;
                counter.textContent = "How many fingers do you need?";
                updateWheel(0);
            }
        }, 900);

        return;
    }

    roundLocked = true;

    const largerSide = leftCount > rightCount ? leftCircles : rightCircles;
    const circlesToRemove = Array.from(
        largerSide.querySelectorAll(".circle")
    ).slice(-fingers);

    circlesToRemove.forEach((circle, index) => {
        setTimeout(() => {
            circle.classList.add("removing");
            setTimeout(() => {
                const row = circle.parentElement;
                circle.remove();
                if (row && row.classList.contains("circle-row") && !row.children.length) {
                    row.remove();
                }
            }, 320);
        }, index * 110);
    });

    counter.textContent = "Perfect! Both sides are equal!";
    activePointers.clear();

    setTimeout(() => {
        success.classList.add("show");
        createConfetti();

        setTimeout(() => {
            if (roundLocked) newRound();
        }, 3000);
    }, 450);
}

function createConfetti() {
    const colors = [
        "#ff6b6b", "#ffd93d", "#6bcB77",
        "#4d96ff", "#b983ff", "#ff85a1"
    ];

    for (let i = 0; i < 90; i++) {
        const piece = document.createElement("div");
        piece.className = "confetti";
        piece.style.left = Math.random() * 100 + "vw";
        piece.style.backgroundColor = colors[randomInt(0, colors.length - 1)];
        piece.style.animationDelay = Math.random() * 0.8 + "s";
        document.body.appendChild(piece);
        setTimeout(() => piece.remove(), 4000);
    }
}

/*
 * Listen on document so touches can begin anywhere on the page.
 * Every new finger restarts the hold timer using the new total.
 * Lifting any finger cancels the attempt.
 */
document.addEventListener("pointerdown", event => {
    if (roundLocked) return;
    if (event.pointerType === "mouse" && event.button !== 0) return;
    if (event.target.closest("button, a")) return;

    event.preventDefault();

    activePointers.add(event.pointerId);
    startHold();
}, { passive: false });

function cancelAttempt(event) {
    if (!activePointers.has(event.pointerId)) return;

    activePointers.clear();
    clearHold();

    if (!roundLocked) {
        counter.textContent = "Try holding your fingers again!";
    }
}

document.addEventListener("pointerup", cancelAttempt);
document.addEventListener("pointercancel", cancelAttempt);

window.addEventListener("blur", () => {
    activePointers.clear();
    clearHold();
});

newRound();
</script>

</body>
</html>
