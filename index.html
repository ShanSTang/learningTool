
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport"
      content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">

<title>Finger Match!</title>

<style>
* {
    box-sizing: border-box;
    -webkit-tap-highlight-color: transparent;
}

body {
    margin: 0;
    overflow: hidden;
    font-family: "Trebuchet MS", sans-serif;
    background: #f7f5ff;
    color: #34304d;
    touch-action: none;
    user-select: none;
    -webkit-user-select: none;
}

header {
    height: 115px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 15px 35px;
    background: white;
    box-shadow: 0 3px 15px #0000000c;
    position: relative;
    z-index: 10;
}

h1 {
    font-size: clamp(25px, 4vw, 38px);
    margin: 0;
    color: #6355b5;
}

#instructions {
    font-size: clamp(15px, 2vw, 20px);
    margin-top: 5px;
    color: #88839e;
}

button {
    border: none;
    background: #7465d5;
    color: white;
    border-radius: 18px;
    padding: 15px 25px;
    font-size: 18px;
    font-weight: bold;
    cursor: pointer;
    box-shadow: 0 4px 0 #50439f;
}

button:active {
    transform: translateY(3px);
    box-shadow: 0 1px 0 #50439f;
}

#game {
    height: calc(100dvh - 115px);
    width: 100vw;
    position: relative;
    overflow: hidden;
    touch-action: none;
}

.circle {
    position: absolute;
    border-radius: 50%;
    display: flex;
    align-items: center;
    justify-content: center;
    box-shadow:
        inset -8px -10px 15px #00000012,
        inset 5px 5px 12px #ffffff55,
        0 8px 18px #00000012;
    animation: appear 0.55s cubic-bezier(.2, 1.5, .5, 1);
    pointer-events: none;
}

@keyframes appear {
    from {
        transform: scale(0) rotate(-90deg);
        opacity: 0;
    }
    to {
        transform: scale(1) rotate(0);
        opacity: 1;
    }
}

#counter {
    position: absolute;
    bottom: 22px;
    left: 50%;
    transform: translateX(-50%);
    background: white;
    padding: 12px 25px;
    border-radius: 30px;
    font-size: 19px;
    color: #77718e;
    box-shadow: 0 3px 15px #00000010;
    z-index: 5;
    white-space: nowrap;
}

#success {
    position: fixed;
    inset: 0;
    z-index: 20;
    background: #ffffffd9;
    display: none;
    align-items: center;
    justify-content: center;
    flex-direction: column;
    text-align: center;
    pointer-events: none;
}

#success.show {
    display: flex;
    animation: fadeIn 0.3s ease;
}

#success h2 {
    font-size: clamp(45px, 9vw, 85px);
    color: #7465d5;
    margin: 10px;
    animation: bounce 0.7s infinite alternate;
}

#success p {
    font-size: clamp(20px, 4vw, 30px);
    color: #817b99;
}

@keyframes fadeIn {
    from { opacity: 0; }
    to { opacity: 1; }
}

@keyframes bounce {
    from { transform: scale(1) rotate(-3deg); }
    to { transform: scale(1.12) rotate(3deg); }
}

.confetti {
    position: fixed;
    top: -20px;
    width: 13px;
    height: 20px;
    z-index: 30;
    pointer-events: none;
    animation: fall 2.5s linear forwards;
}

@keyframes fall {
    to {
        transform: translateY(110vh) rotate(800deg);
        opacity: 0;
    }
}

@media (max-width: 600px) {
    header {
        padding: 12px 18px;
        height: 100px;
    }

    #game {
        height: calc(100dvh - 100px);
    }

    button {
        padding: 12px 16px;
        font-size: 15px;
    }
}
</style>
</head>

<body>

<header>
    <div>
        <h1>Finger Match!</h1>
        <div id="instructions">
            How many fingers can you match?
        </div>
    </div>

    <button onclick="newRound()">New Round ↻</button>
</header>

<main id="game">
    <div id="counter">Get ready!</div>
</main>

<div id="success">
    <h2>AMAZING! 🎉</h2>
    <p>You matched all the circles!</p>
</div>

<script>

const game = document.getElementById("game");
const counter = document.getElementById("counter");
const success = document.getElementById("success");

const colors = [
    "#FF7777",
    "#FFB84D",
    "#FFE066",
    "#78DCA0",
    "#58C7E8",
    "#7898F5",
    "#B18AE8",
    "#F28CCB"
];

let targetCount = 0;
let activePointers = new Set();
let completed = false;
let holdTimer = null;
let holdStart = null;

const HOLD_DURATION = 3000;

// Generate a new round
function newRound() {
    targetCount = Math.floor(Math.random() * 8) + 1;

    activePointers.clear();
    completed = false;
    cancelHold();

    success.classList.remove("show");
    game.querySelectorAll(".circle").forEach(c => c.remove());

    counter.textContent = "How many circles are there?";

    createCircles();
}

// Create randomly scattered circles
function createCircles() {
    const bounds = game.getBoundingClientRect();

    const diameter = Math.min(
        145,
        Math.max(75, Math.min(bounds.width / 8, bounds.height / 4))
    );

    const positions = [];

    for (let i = 0; i < targetCount; i++) {
        let x, y;
        let attempts = 0;
        let valid = false;

        do {
            x = Math.random() * (bounds.width - diameter);
            y = Math.random() * (bounds.height - diameter - 65);

            valid = positions.every(pos => {
                const dx = x - pos.x;
                const dy = y - pos.y;

                return Math.sqrt(dx * dx + dy * dy) >
                    diameter * 1.25;
            });

            attempts++;
        } while (!valid && attempts < 100);

        positions.push({ x, y });

        const circle = document.createElement("div");
        circle.className = "circle";

        circle.style.width = diameter + "px";
        circle.style.height = diameter + "px";
        circle.style.left = x + "px";
        circle.style.top = y + "px";
        circle.style.background = colors[i];

        game.appendChild(circle);
    }
}

// Track simultaneous fingers
game.addEventListener("pointerdown", event => {
    if (event.pointerType !== "touch" || completed) return;

    activePointers.add(event.pointerId);
    updateFingerCount();
});

function removeFinger(event) {
    if (event.pointerType !== "touch") return;

    activePointers.delete(event.pointerId);

    if (!completed) {
        updateFingerCount();
    }
}

game.addEventListener("pointerup", removeFinger);
game.addEventListener("pointercancel", removeFinger);

// Cancel the hold timer
function cancelHold() {
    clearInterval(holdTimer);
    holdTimer = null;
    holdStart = null;
}

// Check finger count and start/reset hold
function updateFingerCount() {
    const count = activePointers.size;

    // Exact number of fingers required
    if (count !== targetCount) {
        cancelHold();
        counter.textContent = "How many circles are there?";
        return;
    }

    // Already holding: don't restart timer
    if (holdTimer !== null) return;

    // Start 3-second hold
    holdStart = Date.now();

    counter.textContent = "Hold... 3";

    holdTimer = setInterval(() => {
        const elapsed = Date.now() - holdStart;
        const remaining = Math.max(
            0,
            Math.ceil((HOLD_DURATION - elapsed) / 1000)
        );

        // Make sure finger count is still exact
        if (activePointers.size !== targetCount) {
            cancelHold();
            updateFingerCount();
            return;
        }

        counter.textContent = "Hold... " + remaining;

        if (elapsed >= HOLD_DURATION) {
            cancelHold();
            celebrate();
        }
    }, 50);
}

// Celebration!
function celebrate() {
    if (completed) return;

    completed = true;

    counter.textContent = "Perfect match!";

    success.classList.add("show");

    // Confetti!
    for (let i = 0; i < 100; i++) {
        const piece = document.createElement("div");
        piece.className = "confetti";

        piece.style.left = Math.random() * 100 + "vw";
        piece.style.background =
            colors[Math.floor(Math.random() * colors.length)];

        piece.style.animationDelay =
            Math.random() * 0.8 + "s";

        piece.style.animationDuration =
            (1.5 + Math.random() * 2) + "s";

        document.body.appendChild(piece);

        setTimeout(() => piece.remove(), 4500);
    }

    // Automatically prepare the next round
    setTimeout(() => {
        if (completed) newRound();
    }, 3000);
}

// Start the game
newRound();

</script>

</body>
</html>
