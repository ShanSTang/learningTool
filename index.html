
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport"
      content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">

<title>Finger Match!</title>

<link href="style.css" rel="stylesheet"/>
</head>

<body>

<header>
    <div>
        <h1>Finger Match!</h1>
        <div id="instructions">
            How many fingers can you match?
        </div>
    </div>

    <div class="level-selector">
        <button class="level-btn active" onclick="setLevel(4, this)">
            LvL 1
        </button>
        <button class="level-btn" onclick="setLevel(6, this)">
            LvL 2
        </button>
        <button class="level-btn" onclick="setLevel(8, this)">
            LvL 3
        </button>
    </div>

    <button onclick="newRound()">New Round ↻</button>
</header>

<main id="game">
    <div id="counter">Get ready!</div> <div id="hold-wheel"><div id="wheel-inner"></div></div>
</main>

<div id="success">
    <h2>AMAZING! 🎉</h2>
    <p>You matched all the circles!</p>
</div>

<script src="app.js"></script>

</body>
</html>
